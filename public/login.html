<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Macro Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b12;
        --card: rgba(15, 21, 32, 0.94);
        --line: rgba(199, 214, 233, 0.14);
        --line-strong: rgba(199, 214, 233, 0.22);
        --text: #f3f7fb;
        --text-secondary: #b5c2d2;
        --muted: #8494aa;
        --accent: #5bb8f7;
        --primary: #45d6b5;
        --danger: #f36a8d;
        --focus-ring: 0 0 0 3px rgba(91, 184, 247, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background-color: var(--bg);
        background-image:
          radial-gradient(ellipse at 12% -8%, rgba(38, 112, 142, 0.2), transparent 42%),
          radial-gradient(ellipse at 92% 108%, rgba(42, 116, 92, 0.14), transparent 46%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 1.25rem;
        line-height: 1.5;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        width: min(460px, 100%);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--card);
        padding: 2rem;
        backdrop-filter: blur(20px) saturate(115%);
        -webkit-backdrop-filter: blur(20px) saturate(115%);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.38);
      }

      .card::before {
        position: absolute;
        top: 0;
        right: 12%;
        left: 12%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(91, 184, 247, 0.55), rgba(69, 214, 181, 0.45), transparent);
        content: '';
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      .login-brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        gap: 0.65rem;
        margin: 0 auto 0.5rem;
      }

      .login-brand-logo {
        width: 40px;
        height: 40px;
        filter: drop-shadow(0 6px 16px rgba(41, 177, 174, 0.16));
      }

      .login-brand-wordmark {
        font-size: 1.72rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        background: linear-gradient(100deg, #f4f8fb 0%, #8ed9ed 58%, #78d8bd 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        text-align: center;
      }

      .login-buttons {
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
      }

      .login-btn {
        width: 100%;
        min-height: 52px;
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 0.78rem 1rem;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 700;
        cursor: pointer;
        transition:
          background-color 150ms ease,
          border-color 150ms ease,
          box-shadow 150ms ease,
          color 150ms ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        font-size: 0.95rem;
      }

      .login-btn svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }

      .google-btn {
        border-color: rgba(255, 255, 255, 0.7);
        background: #f6f8fb;
        color: #17202d;
      }

      .google-btn:hover {
        border-color: #fff;
        background: #fff;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
      }

      .apple-btn {
        background: rgba(255, 255, 255, 0.055);
        color: var(--text);
      }

      .apple-btn:hover {
        border-color: var(--line-strong);
        background: rgba(255, 255, 255, 0.09);
        box-shadow: none;
      }

      .login-btn:focus-visible,
      .legal-links a:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }

      .login-divider {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        margin: 0.1rem 0;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .login-divider::before,
      .login-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--line);
      }

      .error {
        margin: 1rem 0 0;
        color: #ff9ab5;
        font-size: 0.86rem;
      }

      .version {
        margin-top: 1rem;
        margin-bottom: 0;
        font-size: 0.74rem;
        color: var(--muted);
        text-align: center;
      }

      .legal-links {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 1rem;
        font-size: 0.74rem;
      }

      .legal-links a {
        color: var(--muted);
        text-underline-offset: 0.2em;
      }

      .legal-links a:hover {
        color: var(--text-secondary);
      }

      @media (max-width: 520px) {
        body {
          padding: 0.8rem;
        }

        .card {
          padding: 1.4rem 1.1rem;
          border-radius: 22px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="login-brand" aria-label="DailyMacros">
        <img class="login-brand-logo" src="/logo-mark.svg" alt="" aria-hidden="true" />
        <span class="login-brand-wordmark">DailyMacros</span>
      </div>
      <p>Sign in to continue to the app.</p>
      <div class="login-buttons">
        <button id="google-login-btn" class="login-btn google-btn" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Continue with Google
        </button>
        <div class="login-divider">or</div>
        <button id="apple-login-btn" class="login-btn apple-btn" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C3.79 16.17 4.36 9.43 8.7 9.2c1.25.07 2.12.72 2.87.76.98-.2 1.92-.77 2.98-.7 1.26.1 2.2.6 2.82 1.5-2.58 1.54-1.97 4.93.36 5.88-.45 1.17-.67 1.7-1.24 2.72l-.44.92zM12.05 9.13C11.86 6.94 13.6 5.14 15.66 5c.32 2.44-2.22 4.27-3.61 4.13z"/></svg>
          Continue with Apple
        </button>
      </div>
      <p id="error" class="error" hidden>Sign-in failed. Please try again.</p>
      <p id="login-version" class="version" hidden></p>
      <nav class="legal-links" aria-label="Legal">
        <a href="/privacy">Privacy Policy</a>
        <a href="/terms">Terms of Service</a>
      </nav>
    </main>

    <script src="/login.js"></script>
  </body>
</html>
