name: TestFlight

# Reusable only: called by release.yml's `ios` job after `verify` passes.
# The release guards and upload path live in jimgreco/release-tools/ios, pinned
# by commit. The policy (.github/scripts/release-policy.json) pins the existing
# app, TestFlight audience, certificate and profile, and its buildAudience
# (default APP_STORE_ELIGIBLE) decides the export audience.
on:
  workflow_call:

permissions:
  contents: read


jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # build number = full commit count
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: jimgreco/release-tools/ios/prepare@bfd9d14bb12907b74bceaa28b7c0382fb3549ea6
        with:
          policy: .github/scripts/release-policy.json
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          dist-cert-p12: ${{ secrets.IOS_DIST_CERT_P12 }}
          dist-cert-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      # No configure-plist step: Info.plist values come from build settings below,
      # and the artifact check enforces APIBaseURL/AppBuild/GitCommitHash
      # (policy mainInfoPlist).
      - uses: jimgreco/release-tools/ios/upload@bfd9d14bb12907b74bceaa28b7c0382fb3549ea6
        with:
          project: ios/DailyMacros/DailyMacros.xcodeproj
          scheme: DailyMacros
          extra-build-settings: |
            PROVISIONING_PROFILE_SPECIFIER=@PROFILE_UUID:app@
            API_BASE_URL=https://macrovana.com
            APP_BUILD=@BUILD_NUMBER@
            GIT_COMMIT_HASH=@GIT_SHA7@

      - uses: jimgreco/release-tools/ios/cleanup@bfd9d14bb12907b74bceaa28b7c0382fb3549ea6
        if: always()
