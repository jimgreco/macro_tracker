name: TestFlight

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macros-testflight
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          for p in /Applications/Xcode_26.4.app /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_26.1.app /Applications/Xcode_26.0.app /Applications/Xcode_26.app /Applications/Xcode-26.app /Applications/Xcode.app; do
            if [ -d "$p" ]; then
              sudo xcode-select -s "$p/Contents/Developer"
              echo "Selected: $p"
              break
            fi
          done
          xcodebuild -version

      - name: Test release guards and bind source
        run: |
          set -euo pipefail
          node --test .github/scripts/release-guard-tests.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_release.py
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          python3 .github/scripts/verify-release.py prepare-source --sha "$GITHUB_SHA" --build "$BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Validate existing configuration and prepare isolated authentication
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PWD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          KC_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          IOS_API_BASE_URL: ${{ secrets.IOS_API_BASE_URL }}
        run: |
          set -euo pipefail
          for name in CERT_P12 CERT_PWD PROFILE PROFILE_NAME KC_PWD TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID API_KEY IOS_API_BASE_URL; do
            test -n "${!name}" || { echo "Missing existing app-specific configuration: $name"; exit 1; }
          done
          test "$TEAM_ID" = V6JPQCD336
          if [ "$IOS_API_BASE_URL" != "https://macrovana.com" ]; then
            echo "IOS_API_BASE_URL must be exactly https://macrovana.com."
            exit 1
          fi
          umask 077
          RELEASE_TEMP="$(mktemp -d "$RUNNER_TEMP/macros-release.XXXXXX")"
          echo "RELEASE_TEMP=$RELEASE_TEMP" >> "$GITHUB_ENV"
          export RELEASE_TEMP
          mkdir "$RELEASE_TEMP/private_keys"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = os.environ['API_KEY'].strip().replace('\\n', '\n')
          if 'BEGIN PRIVATE KEY' not in key:
              key = base64.b64decode(key).decode()
          if 'BEGIN PRIVATE KEY' not in key:
              raise SystemExit('Existing API key encoding is unsupported.')
          key_id = os.environ['APP_STORE_CONNECT_KEY_ID']
          if not key_id.isalnum():
              raise SystemExit('Invalid API key identifier.')
          path = Path(os.environ['RELEASE_TEMP'])/'private_keys'/('AuthKey_'+key_id+'.p8')
          with path.open('x') as file:
              file.write(key.rstrip()+'\n')
          with open(os.environ['GITHUB_ENV'], 'a') as file:
              file.write('APP_STORE_CONNECT_API_KEY_PATH='+str(path)+'\n')
              for name in ['APP_STORE_CONNECT_KEY_ID', 'APP_STORE_CONNECT_ISSUER_ID']:
                  value = os.environ[name]
                  if '\n' in value or '\r' in value:
                      raise SystemExit('Invalid authentication metadata.')
                  file.write(name+'='+value+'\n')
          PY

      - name: Validate configured signing assets without changing Apple resources
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PWD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$CERT_P12" | base64 -d > "$RELEASE_TEMP/cert.p12"
          if openssl pkcs12 -in "$RELEASE_TEMP/cert.p12" -noout -passin env:CERT_PWD; then
            echo 'openssl pkcs12 verification: OK'
          elif openssl pkcs12 -legacy -in "$RELEASE_TEMP/cert.p12" -noout -passin env:CERT_PWD; then
            echo 'openssl pkcs12 verification: OK (legacy provider)'
          else
            exit 1
          fi
          if ! openssl pkcs12 -in "$RELEASE_TEMP/cert.p12" -clcerts -nokeys -passin env:CERT_PWD -out "$RELEASE_TEMP/certificate.pem"; then
            openssl pkcs12 -legacy -in "$RELEASE_TEMP/cert.p12" -clcerts -nokeys -passin env:CERT_PWD -out "$RELEASE_TEMP/certificate.pem"
          fi
          openssl x509 -in "$RELEASE_TEMP/certificate.pem" -outform DER -out "$RELEASE_TEMP/certificate.der"
          printf '%s' "$PROFILE" | base64 -d > "$RELEASE_TEMP/configured.mobileprovision"
          python3 .github/scripts/verify-release.py configure-policy --profile "$RELEASE_TEMP/configured.mobileprovision" --certificate-der "$RELEASE_TEMP/certificate.der" --output "$RELEASE_TEMP/signing-policy.json"
          MACROS_RELEASE_POLICY="$RELEASE_TEMP/signing-policy.json" node .github/scripts/asc-readonly.mjs scope-policy --output "$RELEASE_TEMP/release-policy.json"
          echo "MACROS_RELEASE_POLICY=$RELEASE_TEMP/release-policy.json" >> "$GITHUB_ENV"

      - name: GET-only current audience, build and signing preflight
        run: |
          set -euo pipefail
          node .github/scripts/asc-readonly.mjs preflight --sha "$GITHUB_SHA" --build "$BUILD_NUMBER"
          mkdir "$RELEASE_TEMP/profiles"
          node .github/scripts/asc-readonly.mjs profiles --certificate-der "$RELEASE_TEMP/certificate.der" --directory "$RELEASE_TEMP/profiles"
          cmp "$RELEASE_TEMP/configured.mobileprovision" "$RELEASE_TEMP/profiles/app.mobileprovision"
          python3 .github/scripts/verify-release.py profiles --directory "$RELEASE_TEMP/profiles" --certificate-der "$RELEASE_TEMP/certificate.der" --destination "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          python3 - <<'PY'
          import json, os
          p = json.load(open(os.environ['MACROS_RELEASE_POLICY']))
          with open(os.environ['GITHUB_ENV'], 'a') as file:
              file.write('SIGNING_CERTIFICATE='+p['certificateSha1']+'\n')
              file.write('PROFILE_UUID='+p['profiles']['app']['uuid']+'\n')
          PY

      - name: Import only the existing configured identity
        env:
          CERT_PWD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KC_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RELEASE_TEMP/signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security list-keychains -d user > "$RELEASE_TEMP/original-keychains.txt"
          security create-keychain -p "$KC_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PWD" "$KEYCHAIN_PATH"
          python3 - "$KEYCHAIN_PATH" "$RELEASE_TEMP/original-keychains.txt" <<'PY'
          import shlex, subprocess, sys
          from pathlib import Path
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', sys.argv[1], *shlex.split(Path(sys.argv[2]).read_text())], check=True)
          PY
          security import "$RELEASE_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PWD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PWD" "$KEYCHAIN_PATH" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Fq "$SIGNING_CERTIFICATE"

      - name: Archive using verified existing assets only
        env:
          IOS_API_BASE_URL: ${{ secrets.IOS_API_BASE_URL }}
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-release.py source --sha "$GITHUB_SHA" --build "$BUILD_NUMBER"
          GIT_COMMIT_HASH="$(git rev-parse --short=7 HEAD)"
          xcodebuild archive \
            -project ios/DailyMacros/DailyMacros.xcodeproj \
            -scheme DailyMacros -configuration Release \
            -archivePath "$RELEASE_TEMP/DailyMacros.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=V6JPQCD336 CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_CERTIFICATE" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            API_BASE_URL="$IOS_API_BASE_URL" APP_BUILD="$BUILD_NUMBER" \
            GIT_COMMIT_HASH="$GIT_COMMIT_HASH"

      - name: Export internal-only IPA without provisioning updates
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-release.py export-options --output "$RELEASE_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RELEASE_TEMP/DailyMacros.xcarchive" -exportOptionsPlist "$RELEASE_TEMP/ExportOptions.plist" -exportPath "$RELEASE_TEMP/export"
          python3 - <<'PY'
          import os
          from pathlib import Path
          files = list((Path(os.environ['RELEASE_TEMP'])/'export').glob('*.ipa'))
          if len(files) != 1:
              raise SystemExit('Expected exactly one exported Macros IPA.')
          with open(os.environ['GITHUB_ENV'], 'a') as file:
              file.write('IPA_PATH='+str(files[0])+'\n')
          PY

      - name: Verify artifact and recheck current Apple scope immediately before upload
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-release.py artifact --ipa "$IPA_PATH" --sha "$GITHUB_SHA" --build "$BUILD_NUMBER"
          mkdir "$RELEASE_TEMP/final-profiles"
          node .github/scripts/asc-readonly.mjs profiles --certificate-der "$RELEASE_TEMP/certificate.der" --directory "$RELEASE_TEMP/final-profiles"
          cmp "$RELEASE_TEMP/profiles/app.mobileprovision" "$RELEASE_TEMP/final-profiles/app.mobileprovision"
          node .github/scripts/asc-readonly.mjs preflight --sha "$GITHUB_SHA" --build "$BUILD_NUMBER"

      - name: Upload one verified internal-only build
        run: |
          set -euo pipefail
          cd "$RELEASE_TEMP"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1 | tee "$RELEASE_TEMP/upload.log"
          if grep -Eiq 'NOT_AUTHORIZED|failed to authenticate|received status code 401|UPLOAD FAILED|Validation failed|Failed to upload package|Failed to determine the Apple ID' "$RELEASE_TEMP/upload.log"; then exit 1; fi
          grep -Eiq 'UPLOAD SUCCEEDED|successfully uploaded' "$RELEASE_TEMP/upload.log"

      - name: Verify processing and existing internal group availability
        run: |
          set -euo pipefail
          node .github/scripts/asc-readonly.mjs verify-upload --sha "$GITHUB_SHA" --build "$BUILD_NUMBER"

      - name: Clean only this run's signing files
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TEMP:-}" ]; then
            if [ -f "$RELEASE_TEMP/original-keychains.txt" ]; then
              python3 - "$RELEASE_TEMP/original-keychains.txt" <<'PY'
          import shlex, subprocess, sys
          from pathlib import Path
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *shlex.split(Path(sys.argv[1]).read_text())], check=True)
          PY
            fi
            if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then security delete-keychain "$KEYCHAIN_PATH"; fi
            rm -f "$RELEASE_TEMP/cert.p12" "$RELEASE_TEMP/private_keys/"*.p8
          fi
