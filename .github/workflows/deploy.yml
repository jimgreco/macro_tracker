name: Deploy to EC2

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate deploy secrets
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          missing=0
          for name in EC2_SSH_KEY EC2_USER EC2_HOST; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret/env: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install SSH key and verify host
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/macros_deploy_key
          chmod 600 ~/.ssh/macros_deploy_key
          if [ -z "$EC2_SSH_KNOWN_HOSTS" ]; then
            echo "A verified EC2_SSH_KNOWN_HOSTS secret is required for CI deployment."
            exit 1
          fi
          printf '%s\n' "$EC2_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer files to EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          rsync -avz -e "ssh -i ~/.ssh/macros_deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'output' \
            --exclude '.env' \
            --exclude '.env.*' \
            . "$EC2_USER@$EC2_HOST:~/macros/"

      - name: Rebuild only Macrovana with the existing live configuration
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/macros_deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" \
            "python3 ~/macros/scripts/safe-compose-release.py macros '$GITHUB_SHA'"

      - name: Skip post-deploy smoke when production URL is not configured
        if: env.PRODUCTION_BASE_URL == ''
        run: |
          echo "::notice::PRODUCTION_BASE_URL is not configured; skipping post-deploy smoke checks."

      - name: Post-deploy smoke checks
        if: env.PRODUCTION_BASE_URL != ''
        run: |
          set -euo pipefail
          scripts/production-smoke.sh
